<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Paul Mwaniki — Financial Engineering, Quantitative Research, Trading Systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="52%" stop-color="#0D1117" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="220" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="220" fill="#0D1117"/>

    <!-- grid -->
    <g stroke="#1B2129" stroke-width="1">
      <path d="M0 44H1000M0 88H1000M0 132H1000M0 176H1000"/>
    </g>
    <g stroke="#161B22" stroke-width="1">
      <path d="M100 0V220M200 0V220M300 0V220M400 0V220M500 0V220M600 0V220M700 0V220M800 0V220M900 0V220"/>
    </g>

    <!-- equity curve -->
    <path fill="url(#under)" d="M0 185 L25 180 L50 188 L75 176 L100 170 L125 178 L150 165 L175 158 L200 166 L225 152 L250 157 L275 145 L300 150 L325 138 L350 143 L375 130 L400 136 L425 122 L450 128 L475 118 L500 124 L525 110 L550 116 L575 104 L600 112 L625 98 L650 103 L675 92 L700 97 L725 85 L750 90 L775 78 L800 84 L825 72 L850 77 L875 66 L900 70 L925 58 L950 63 L975 52 L1000 48 L1000 220 L0 220 Z"/>
    <path fill="none" stroke="#58A6FF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="1600" stroke-dashoffset="1600"
          d="M0 185 L25 180 L50 188 L75 176 L100 170 L125 178 L150 165 L175 158 L200 166 L225 152 L250 157 L275 145 L300 150 L325 138 L350 143 L375 130 L400 136 L425 122 L450 128 L475 118 L500 124 L525 110 L550 116 L575 104 L600 112 L625 98 L650 103 L675 92 L700 97 L725 85 L750 90 L775 78 L800 84 L825 72 L850 77 L875 66 L900 70 L925 58 L950 63 L975 52 L1000 48">
      <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="2.6s" begin="0s" fill="freeze"/>
    </path>
    <circle cx="1000" cy="48" r="3.5" fill="#58A6FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
    </circle>

    <!-- text scrim -->
    <rect width="1000" height="220" fill="url(#scrim)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="82" fill="#E6EDF3" font-size="38" font-weight="700" letter-spacing="3.5">PAUL MWANIKI</text>
      <text x="46" y="112" fill="#7D8590" font-size="13.5" letter-spacing="2.6">FINANCIAL ENGINEERING · QUANTITATIVE RESEARCH · TRADING SYSTEMS</text>

      <text x="46" y="158" fill="#3FB950" font-size="13.5">$</text>
      <text x="62" y="158" fill="#8B949E" font-size="13.5">strathmore --program=fin-eng --year=3</text>
      <rect x="352" y="147" width="8" height="14" fill="#3FB950">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <g font-size="11" letter-spacing="1.4">
        <rect x="44" y="176" width="72" height="22" rx="4" fill="#161B22" stroke="#30363D"/>
        <text x="58" y="191" fill="#8B949E">XAUUSD</text>
        <rect x="124" y="176" width="72" height="22" rx="4" fill="#161B22" stroke="#30363D"/>
        <text x="138" y="191" fill="#8B949E">GBPJPY</text>
        <rect x="204" y="176" width="66" height="22" rx="4" fill="#161B22" stroke="#30363D"/>
        <text x="219" y="191" fill="#8B949E">PYTHON</text>
        <rect x="278" y="176" width="42" height="22" rx="4" fill="#161B22" stroke="#30363D"/>
        <text x="293" y="191" fill="#8B949E">C#</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="999" height="219" rx="10" fill="none" stroke="#30363D"/>
  </g>
</svg>
