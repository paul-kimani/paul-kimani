name: Refresh strategy cards

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**.csv"
      - "scripts/profile_cards.py"
  schedule:
    - cron: "0 3 * * 1"   # Mondays, 03:00 UTC

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          python scripts/profile_cards.py --csv data/gold_pulse.csv \
            --name "Gold Pulse" --meta "XAUUSD · H1" --periods 6240 \
            --out assets/card-gold-pulse.svg
          python scripts/profile_cards.py --csv data/squeeze_pulse.csv \
            --name "Squeeze Pulse Breakout" --meta "GBPJPY · H1" --periods 6240 \
            --out assets/card-squeeze-pulse.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh strategy cards"
          git push
